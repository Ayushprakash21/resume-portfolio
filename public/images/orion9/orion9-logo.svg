<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Glass Container Gradient -->
    <linearGradient id="squircleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1B22" />
      <stop offset="50%" stop-color="#101116" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>

    <!-- Chrome Metallic Gradients -->
    <linearGradient id="chromeO" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E8E8EE" />
      <stop offset="50%" stop-color="#B8B8C2" />
      <stop offset="75%" stop-color="#7A7A85" />
      <stop offset="100%" stop-color="#DCDCE2" />
    </linearGradient>

    <linearGradient id="chrome9" x1="0%" y1="10%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#D0D0D8" />
      <stop offset="60%" stop-color="#8E8E9A" />
      <stop offset="85%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#60606B" />
    </linearGradient>

    <linearGradient id="swoopGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70707C" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#E0E0E6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="silverGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base with subtle silver border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#squircleBg)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="2.5" />
  
  <!-- Subtle Inner Top Highlight -->
  <rect x="18" y="18" width="476" height="476" rx="110" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- The O9 Interconnected Emblem -->
  <g transform="translate(48, 80)">
    <!-- Orbital Swoop Arc -->
    <path d="M 120 330 C 260 380, 380 270, 395 130 C 400 95, 395 70, 385 45" 
          fill="none" stroke="url(#swoopGrad)" stroke-width="6.5" stroke-linecap="round" />

    <!-- 4-point Sparkle Star -->
    <g transform="translate(388, 40)" filter="url(#starGlow)">
      <!-- Vertical Spoke -->
      <path d="M 0 -28 Q 0 0 28 0 Q 0 0 0 28 Q 0 0 -28 0 Q 0 0 0 -28 Z" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" />
    </g>

    <!-- Outer 'O' Ring -->
    <path d="M 140 120 
             C 70 120, 20 175, 20 250 
             C 20 325, 70 380, 140 380 
             C 195 380, 240 345, 255 295
             C 250 280, 245 260, 240 240
             C 225 305, 185 338, 140 338
             C 95 338, 62 298, 62 250
             C 62 202, 95 162, 140 162
             C 185 162, 222 195, 238 245
             C 246 225, 252 205, 256 185
             C 240 145, 195 120, 140 120 Z" 
          fill="url(#chromeO)" filter="url(#silverGlow)" />

    <!-- Intertwined '9' Numeral -->
    <path d="M 270 125
             C 215 125, 175 168, 175 228
             C 175 288, 215 330, 270 330
             C 305 330, 335 312, 350 285
             L 320 365
             C 310 390, 280 405, 245 405
             L 245 440
             C 300 440, 350 415, 368 368
             L 405 270
             C 415 245, 418 220, 418 195
             C 418 150, 385 125, 335 125
             L 270 125 Z
             M 285 168
             C 330 168, 365 195, 365 235
             C 365 275, 330 300, 285 300
             C 245 300, 218 275, 218 235
             C 218 195, 245 168, 285 168 Z" 
          fill="url(#chrome9)" filter="url(#silverGlow)" />
  </g>
</svg>
