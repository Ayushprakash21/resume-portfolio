<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 48" width="210" height="48" fill="none">
  <!-- Professional Operations Institute (POI) Official Crest -->
  <g transform="translate(6, 4)">
    <!-- Hex Crest Icon -->
    <g transform="translate(0, 1)">
      <polygon points="12,1 23,7.5 23,20.5 12,27 1,20.5 1,7.5" fill="none" stroke="#D6A854" stroke-width="1.8"/>
      <!-- Inner Precision Nodes -->
      <line x1="12" y1="1" x2="12" y2="27" stroke="#D6A854" stroke-width="1.2" stroke-opacity="0.6"/>
      <line x1="1" y1="7.5" x2="23" y2="20.5" stroke="#D6A854" stroke-width="1.2" stroke-opacity="0.6"/>
      <line x1="1" y1="20.5" x2="23" y2="7.5" stroke="#D6A854" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="12" cy="14" r="3.5" fill="#D6A854"/>
      <circle cx="12" cy="14" r="1.5" fill="#0A0D0C"/>
    </g>
    <!-- Text: Professional Operations Institute -->
    <text x="32" y="14" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.04em" fill="#FAF9F5">PROFESSIONAL OPERATIONS</text>
    <text x="32" y="24" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="0.12em" fill="#D6A854">INSTITUTE // POI</text>
  </g>
</svg>
